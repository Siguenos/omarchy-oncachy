name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: cachyos/cachyos:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git imagemagick python sudo
      - uses: actions/checkout@v7
      - name: Build the packages
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          # Runtime dependencies come from [omarchy]; only the build itself is checked here.
          sudo -u builder bin/build.sh --nodeps --noconfirm
          for package in out/*.pkg.tar.zst; do
            echo "${package##*/}: $(du -h "$package" | cut -f1), $(bsdtar -tf "$package" | wc -l) entries"
          done
      - name: Run the tests
        run: sudo -u builder env OMARCHY_TEST_SOURCE=.cache/build/omarchy-oncachy/src/omarchy python3 tests/test_package.py
